name: Security & Quality Audit

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Strict Security & Test Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Unit & Race Tests
        env:
          CGO_ENABLED: '1'
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Install & Run gosec SAST
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Upload gosec SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: 'auto'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
