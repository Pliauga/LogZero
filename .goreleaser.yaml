version: 2

project_name: logzero

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: logzero
    main: ./cmd/logzero
    binary: logzero
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]

signs:
  - artifacts: checksum
    args:
      - "sign-blob"
      - "--yes" # Keyless signing via Sigstore OIDC
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
